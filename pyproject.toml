# ---------------------------------------------------------
# Dockchain
# ---------------------------------------------------------

[project]
name = "dockchain"
version = "0.1.0"
description = "A lightweight, configuration-driven ETL platform with execution lineage, data preservation, and replay."
authors = [
    { name = "Michal Breslin" },
]
readme = "README.md"
requires-python = ">=3.12"

keywords = [
    "etl",
    "data-engineering",
    "data-pipelines",
    "data-lineage",
    "data-reproducibility",
    "workflow-orchestration",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "typer>=0.20,<1.0",
]

# ---------------------------------------------------------
# Optional Features
# ---------------------------------------------------------

[project.optional-dependencies]
tui = [
    "textual>=6.0,<7.0",
]

# ---------------------------------------------------------
# Development Dependencies
# ---------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "mypy>=1.0",
    "ruff>=0.14",
    "pre-commit>=4.0",
]

# ---------------------------------------------------------
# CLI Entry Point
# ---------------------------------------------------------

[project.scripts]
dockchain = "dockchain.cli.main:app"

# ---------------------------------------------------------
# Build System
# ---------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dockchain"]

# ---------------------------------------------------------
# Ruff - Linting and Formatting
# ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------
# MyPy - Static Type Checking
# ---------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# ---------------------------------------------------------
# Pytest - Testing
# ---------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

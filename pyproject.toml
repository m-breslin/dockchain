[project]
name = "dockchain"
version = "0.1.0"
description = "A lightweight, configuration-driven ETL platform with execution lineage, data preservation, and replay."
authors = [
    { name = "Michal Breslin" },
]
requires-python = ">=3.12"

keywords = [
    "etl",
    "data-engineering",
    "data-pipelines",
    "data-lineage",
    "data-reproducibility",
    "workflow-orchestration",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies
dependencies = [
    # Configuration and validation
    "pydantic==2.12.4",
    "PyYAML==6.0.3",

    # CLI and terminal interface
    "typer==0.20.0",
    "rich==14.2.0",

    # Data processing
    "polars==1.35.2",

    # Container execution
    "docker==7.1.0",
]

[project.optional-dependencies]
tui = [
    "textual",
]

dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "pre-commit",
]

[project.scripts]
dockchain = "dockchain.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# -----------------------------
# Hatchling build configuration
# -----------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/dockchain"]

# -----------------------------
# Ruff code quality
# -----------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# -----------------------------
# MyPy type checking
# -----------------------------
[tool.mypy]
python_version = "3.12"
strict = true

# -----------------------------
# Pytest
# -----------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
